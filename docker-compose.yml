services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drillsense
      POSTGRES_PASSWORD: drillsense
      POSTGRES_DB: drillsense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drillsense"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://drillsense:drillsense@db:5432/drillsense
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  simulator:
    build: ./simulator
    environment:
      SIM_DEVICE_COUNT: "3"
      SIM_INTERVAL_SECONDS: "2"
      SIM_ANOMALY_PROBABILITY: "0.05"
      SIM_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    ports:
      - "8501:8501"
    environment:
      DASHBOARD_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
